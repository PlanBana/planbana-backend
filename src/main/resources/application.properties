spring.profiles.active=dev
logging.level.root=INFO
logging.level.com.planbana.backend=DEBUG
logging.level.com.planbana.backend.auth=DEBUG

# Redis is declared as a dependency (RedisConfig/RedisTemplate bean) but no
# application code uses it. Without a Redis server on localhost:6379 the
# auto-configured Redis health indicator always reports DOWN, hiding the real
# status of MongoDB and the app. Opt out until Redis is actually wired in.
management.health.redis.enabled=false

# .env points MAIL_HOST/MAIL_PORT at localhost:1025 (a dev SMTP catcher such as
# MailHog/SMTP4Dev). When no catcher runs, the mail health indicator reports
# DOWN and makes /actuator/health return 503 even though the API is fine.
# Remove this line (or start a catcher on :1025) when email testing is needed.
management.health.mail.enabled=false
# To see per-component health details during debugging, uncomment:
# management.endpoint.health.show-details=always

# Where to store uploaded profile pictures
file.upload-dir=uploads

# ==========================
# Multipart file upload limits
# ==========================
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1524MB


logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.com.planbana.backend.chat=DEBUG
