<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Chat Test</title>
    <style>
        body { font-family: system-ui; max-width: 600px; margin: 40px auto; padding: 20px; }
        input { padding: 8px; margin: 5px 0; width: 100%; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        #chat { border: 1px solid #ddd; height: 200px; overflow-y: auto; padding: 10px; margin: 10px 0; }
        .msg { margin: 5px 0; padding: 5px; background: #f0f0f0; }
    </style>
</head>
<body>
    <h2>🔌 WebSocket Chat Tester</h2>
    <label>JWT Token:</label>
    <input id="token" placeholder="eyJhbGciOi..." />
    <label>Event ID:</label>
    <input id="eventId" placeholder="6aa2c5175d835b1e956a1f21" />
    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()" id="disconnectBtn" disabled>Disconnect</button>
    <p id="status">Not connected</p>
    <label>Message:</label>
    <input id="msgInput" placeholder="Type message..." disabled />
    <button onclick="send()" id="sendBtn" disabled>Send</button>
    <div id="chat"></div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@5/dist/stomp.min.js"></script>
    <script>
        let client = null;
        function connect() {
            const token = document.getElementById('token').value;
            const eventId = document.getElementById('eventId').value;
            if (!token) { alert('Enter JWT token'); return; }
            if (!eventId) { alert('Enter Event ID'); return; }

            document.getElementById('status').textContent = 'Connecting...';

            client = new Stomp.Client({
                webSocketFactory: () => new SockJS('/ws'),
                connectHeaders: {
                    Authorization: 'Bearer ' + token  // ← THIS IS THE FIX
                },
                onConnect: () => {
                    document.getElementById('status').textContent = '✅ Connected!';
                    document.getElementById('msgInput').disabled = false;
                    document.getElementById('sendBtn').disabled = false;
                    document.getElementById('disconnectBtn').disabled = false;
                    client.subscribe('/topic/chat/' + eventId, (msg) => {
                        const data = JSON.parse(msg.body);
                        const div = document.createElement('div');
                        div.className = 'msg';
                        div.innerHTML = '<strong>' + (data.senderName || '?') + ':</strong> ' + (data.text || '');
                        document.getElementById('chat').appendChild(div);
                        document.getElementById('chat').scrollTop = 999999;
                    });
                },
                onStompError: (frame) => {
                    let msg = '❌ Error';
                    if (frame.headers['websocket-status-code'] === '401') {
                        msg = '❌ Auth Failed! Token may be expired.';
                    }
                    document.getElementById('status').textContent = msg;
                    console.error('STOMP error:', frame);
                }
            });
            client.activate();
        }
        function disconnect() {
            if (client) client.deactivate();
            client = null;
            document.getElementById('status').textContent = 'Disconnected';
            document.getElementById('msgInput').disabled = true;
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('disconnectBtn').disabled = true;
        }
        function send() {
            const text = document.getElementById('msgInput').value;
            const eventId = document.getElementById('eventId').value;
            if (!text || !client) return;
            client.publish({
                destination: '/app/chat/' + eventId,
                body: JSON.stringify({ text })
            });
            document.getElementById('msgInput').value = '';
        }
    </script>
</body>
</html>
